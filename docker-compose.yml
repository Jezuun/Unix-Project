services:
  # Web Server (Nginx + PHP)
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: unix_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - db
      - redis
    secrets:
      - db_password
    networks:
      - unix_network

  # Database Server (MariaDB)
  db:
    image: mariadb:10.11
    container_name: unix_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_DATABASE=unix_project
      - MYSQL_USER=unix_user
      - MYSQL_PASSWORD=unix_pass
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - unix_network

  # Cache Server (Redis)
  redis:
    image: redis:7-alpine
    container_name: unix_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - unix_network

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db_data:
  redis_data:

networks:
  unix_network:
    driver: bridge
