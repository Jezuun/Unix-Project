<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Reservation System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Make a Reservation</h1>

  <div id="success-msg" style="display:none; background:#d4edda; color:#155724; padding:12px; border-radius:6px; margin-bottom:16px;">
    ✔ Reservation made successfully!
  </div>

  <form method="POST" action="/php/index.php">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Your phone number" required>
    </div>

    <div class="form-group">
      <label for="guests">Number of Guests</label>
      <input type="number" id="guests" name="guests" placeholder="How many guests?" min="1" max="20" required>
    </div>

    <div class="form-group">
      <label for="date">Reservation Date</label>
      <input type="date" id="date" name="date" required>
    </div>

    <div class="form-group">
      <label for="time">Reservation Time</label>
      <input type="time" id="time" name="time" required>
    </div>

    <div class="form-group">
      <label for="notes">Notes</label>
      <input type="text" id="notes" name="notes" placeholder="Any special requests?">
    </div>

    <button type="submit">Make Reservation</button>
  </form>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get('success') === '1') {
    document.getElementById('success-msg').style.display = 'block';
    history.replaceState(null, '', '/website.html');
  }
</script>
</body>
</html>
